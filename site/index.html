<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Milosh Davidovski — CV</title>
  <meta name="description" content="Milosh Davidovski — Senior Platform & DevOps Engineer. CV in English and German.">
  <meta name="robots" content="noindex">
  <style>
    :root {
      --bg: #f4f5f7; --card: #ffffff; --text: #222222; --muted: #6b6b6b;
      --accent: #2f6fbe; --accent-text: #ffffff; --border: #e3e3e3; --header: #3a3a3c;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #17181a; --card: #222326; --text: #ececec; --muted: #a0a0a5;
        --accent: #5b93d9; --accent-text: #0e1116; --border: #34363a; --header: #2b2c2f;
      }
    }
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center;
      padding: 24px 16px; background: var(--bg); color: var(--text);
      font-family: "Liberation Sans", Arial, Helvetica, sans-serif;
    }
    main {
      width: 100%; max-width: 440px; background: var(--card); border: 1px solid var(--border);
      border-radius: 6px; overflow: hidden; text-align: center;
    }
    header { background: var(--header); color: #fff; padding: 28px 24px 22px; }
    header img {
      width: 120px; height: 120px; border-radius: 50%; object-fit: cover; object-position: center 20%;
      border: 3px solid #fff; display: block; margin: 0 auto 16px;
    }
    h1 { margin: 0; font-size: 1.6rem; letter-spacing: 0.02em; }
    .bar { width: 34px; height: 3px; background: var(--accent); margin: 10px auto; }
    header p { margin: 0; color: #d8d8d8; }
    section { padding: 24px; }
    .buttons { display: grid; gap: 12px; }
    a.btn {
      display: block; padding: 14px 16px; border-radius: 4px; text-decoration: none; font-weight: bold;
      background: var(--accent); color: var(--accent-text);
    }
    a.btn small { display: block; font-weight: normal; opacity: 0.85; margin-top: 2px; }
    a.btn:focus-visible, .links a:focus-visible { outline: 3px solid var(--text); outline-offset: 2px; }
    .links { margin-top: 20px; color: var(--muted); font-size: 0.95rem; line-height: 1.8; }
    .links a { color: var(--accent); text-decoration: none; }
    .links a:hover { text-decoration: underline; }
  </style>
</head>
<body>
  <main>
    <header>
      <img src="photo.jpg" alt="Portrait of Milosh Davidovski">
      <h1>MILOSH DAVIDOVSKI</h1>
      <div class="bar"></div>
      <p>Senior Platform &amp; DevOps Engineer</p>
    </header>
    <section>
      <div class="buttons">
        <a class="btn" href="Milosh_Davidovski_CV_EN.pdf">English CV<small>PDF</small></a>
        <a class="btn" href="Milosh_Davidovski_CV_DE.pdf" lang="de">Deutscher Lebenslauf<small>PDF</small></a>
      </div>
      <div class="links">
        <a href="mailto:milos.davidovski@gmail.com">milos.davidovski@gmail.com</a><br>
        <a href="https://www.linkedin.com/in/milosh-davidovski-ab032113a/">LinkedIn</a> · Vienna, Austria
      </div>
    </section>
  </main>
</body>
</html>
